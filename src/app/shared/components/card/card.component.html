<div class="cards">
    <mat-card (click)="clickiIn(character().id)">      
      <mat-card-content style="display: flex;">
        <img mat-card-image style="width: 80px; height: 80px; border-radius: 100px;" [src]="character().image" [alt]="character().name">
        <mat-card-title style="font-size: 17px; margin-left: 10px;" >{{ character().name }}</mat-card-title>
      </mat-card-content>
    </mat-card>
</div>
